<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otter Thing</title>
    <style>
        body {
            background-color: #555c3f;
            padding: 0;
            margin: 0;
            min-height: 300vh;
        }
        @keyframes hover {
            100% {
                transform: scale(1.1);
                color: lightblue;
                text-decoration: underline;
            }
        }
        .river {
            position: absolute;
            width: 100%;
            height: 100%;
            bottom: 310px;
            left: 0;
            z-index: -1;
            
        }
        .logo {
            width: 300px;
            height: 300px;
            background-color: #414d35;
            position: relative;
            left: 50%;
            top: 30px;
            transform: translate(-50%,0);
            border-radius: 40% 40% 0 0;
        }
        .logoimage {
            max-width: 65%;
            height: auto;
            position: relative;
            left: 50%;
            top: 10px;
            transform: translate(-50%,0);
            border-radius: 100% 100% 100% 100%;
        }
        .logoname {
            font-size: 2rem;
            position: relative;
            left: 65%;
            top: -10px;
            transform: translate(-50%,0);
        }
        .navmenu {
            background-color:  #414d35;
            font-family:"Varela Round", sans-serif;
            font-size: 2rem;
            font-weight: 500;
            display: flex;
            min-height: 4rem;
            flex-direction: row;
            align-items: center;
            padding: 0;
        }

        .menu, .end {
            color: #ebebeb;
            text-decoration: none;
        }
        .menu {
            margin-left: 1rem;
        }
        .end {
            margin-left: 735px;
        }
        .menu:hover, .end:hover {
            animation-name: hover;
            animation-duration: 0.25s;
            animation-fill-mode: both;
            animation-timing-function: linear;
        }

        .topproductboard {
            display: flex;
            width: 95vw;
            height: 75px;
            background-color: #cdcdcd;
            position: relative;
            left:50%;
            top: 25px;
            transform: translate(-50%,0);
            border-radius: 75px 75px 0 0;
            align-items: center;
            justify-content: center;
        }

        .topproductboardname {
            font-size: 2.5rem;
        }

        .topproducts {
            display: flex;
            width: 95vw;
            height: 400px;
            background-color: #ebebeb;
            position: relative;
            left:50%;
            top: 25px;
            transform: translate(-50%,0);
            flex-direction: row;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 25px 25px;
            gap: 15px
        }
        .top1,.top2,.top3 {
            width: 350px;
            height: 350px;
            background-color: navy;
            background-size: cover;
            
        }
        .top1 img {
            transform: scale(25%);
        }
        .top1 {
            background-image: url("https://shop.sheddaquarium.org/cdn/shop/files/653726275469.jpg?v=1770618776");
        }
        .top2 {
            background-image: url("https://i4.cloudfable.net/styles/735x735/128.133/Black/otter-sea-animals-world-chibi-lover-educational-coffee-mug-20240225110021-k2zui33d-s4.jpg");
        }
        .top3 {
            background-image: url("https://i5.walmartimages.com/seo/Otters-in-Water-Leaves-Translucent-Plastic-Cans-Storage-Canisters-with-Lid-Set-of-2_8e8182e4-edee-4fdf-aad6-c2c1132ac45b.d5b67c386e41e97022defda292b1ad8c.jpeg");
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- replace image later -->
    <div class="logo">
        <img class="logoimage" src="https://shop.sheddaquarium.org/cdn/shop/files/653726278521.jpg?v=1769464462">
        <p class="logoname">OTTER THING</p>
    </div>
    <div class="navmenu">
        <a href="index.html" class="menu">Home</a>
        <a href="about.html" class="menu">About</a>
        <a href="products.html" class="menu">Products</a>
        <a href="#" class="end">Contact</a>
    </div>
    <img class="river" src="https://www.earth.com/img/16x9/1920/uploads/2026/01/10075512/River-protection.jpg">
    <div class="topproductboard">
        <p class="topproductboardname">TOP PERFORMING PRODUCTS</p>
    </div>
    <div class="topproducts">
        <div class="top1"></div>
        <div class="top2"></div>
        <div class="top3"></div>
    </div>
</body>
</html>
